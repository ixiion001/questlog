# Achievement tiers. When GitHub changes a rule, edit this file, not the code.
pull_shark:
  label: Pull Shark
  thresholds: [2, 16, 128, 1024]
  summary: Pull requests you opened that were merged.
yolo:
  label: YOLO
  thresholds: [1]
  summary: A pull request you merged without a review.
quickdraw:
  label: Quickdraw
  thresholds: [1]
  summary: An issue or pull request you closed within 5 minutes of opening it.
galaxy_brain:
  label: Galaxy Brain
  thresholds: [2, 8, 16, 32]
  summary: Answers you gave in GitHub Discussions that were marked as accepted.
starstruck:
  label: Starstruck
  thresholds: [16, 128, 512, 4096]
  summary: Stars on the most-starred repository you own.
